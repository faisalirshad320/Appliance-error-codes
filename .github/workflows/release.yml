name: Release due pages

# The only thing that writes to the deploy branch.
#
# Runs on GitHub's servers, so it does not care whether anyone's machine is on. The
# gate is "this wave's date has arrived", not "a job fired at the right moment", so a
# skipped or delayed run costs nothing: the next one publishes everything that is due.
# That also means it can never publish a wave early by catching up.

on:
  schedule:
    - cron: "17 6 * * *"      # daily, 06:17 UTC (11:17 Pakistan)
  push:
    branches: [main]
  workflow_dispatch:           # "Run workflow" in the Actions tab, any time

permissions:
  contents: write

concurrency:
  group: deploy-branch         # never let two runs race for the deploy branch
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Show where the drip has got to
        run: python3 tools/release_status.py

      - name: Build only the pages whose wave is due
        run: python3 site/build.py

      - name: Check the partial site for broken links and bad structured data
        run: python3 tools/qa.py

      # Uses only coreutils. An earlier version used rsync here and the sync silently
      # failed to land for five days: the clone kept its old content, git correctly
      # reported "no change", and the step went green every morning while the site
      # stood still. Hence the assertion below — a sync that does not land must be a
      # red build, never a quiet one.
      - name: Sync the build into a working copy of the deploy branch
        run: |
          git clone --depth 1 --branch deploy \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" \
            deploy-wc 2>/dev/null || {
              echo "no deploy branch yet; creating one"
              git clone --depth 1 \
                "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" \
                deploy-wc
              cd deploy-wc && git checkout --orphan deploy && git rm -rqf . && cd ..
            }
          find deploy-wc -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a dist/. deploy-wc/

      - name: Assert the working copy is byte-identical to the build
        run: |
          if ! diff -rq dist deploy-wc --exclude=.git; then
            echo "::error::deploy-wc does not match dist after the sync. Refusing to"
            echo "::error::publish, because pushing a stale tree would look like success."
            exit 1
          fi
          echo "Sync verified: $(find dist -type f | wc -l) files match."

      - name: Commit and push, but only when the output actually changed
        id: publish
        working-directory: deploy-wc
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            # Cross-check the claim. If the tree really matches HEAD then the sitemap
            # must too; if it does not, the comparison is lying and we want to know.
            if ! git show HEAD:sitemap.xml 2>/dev/null | diff -q - sitemap.xml >/dev/null; then
              echo "::error::git reports no change, but sitemap.xml differs from HEAD."
              echo "::error::The change detection is unreliable; not trusting it."
              exit 1
            fi
            echo "No change in the built site. Nothing to publish today."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Changed files: $(git diff --cached --name-only | wc -l)"
          PAGES=$(find . -name index.html -not -path './.git/*' | wc -l)
          git commit -q -m "Release $(date -u +%Y-%m-%d): ${PAGES} pages live" \
                        -m "Built from ${GITHUB_SHA::8}."
          git push origin deploy
          echo "Published ${PAGES} pages."
          echo "published=true" >> "$GITHUB_OUTPUT"

      # Cloudways does not watch the branch. Updating `deploy` puts the new build on
      # GitHub; this is what gets it onto the server. Without it a wave lands in the
      # repository and never reaches the live site until someone clicks Pull/Deploy.
      #
      # Skipped cleanly when the secrets are absent, so the release itself never fails
      # over a hosting credential.
      # Also on a manual run: that is the button for recovering a server that has
      # fallen behind, and a pull is the only thing that can fix it. Verifying
      # without pulling would just report a problem it refused to act on.
      - name: Tell Cloudways to pull the new build
        if: steps.publish.outputs.published == 'true' || github.event_name == 'workflow_dispatch'
        env:
          CW_EMAIL:  ${{ secrets.CLOUDWAYS_EMAIL }}
          CW_KEY:    ${{ secrets.CLOUDWAYS_API_KEY }}
          CW_TOKEN:  ${{ secrets.CLOUDWAYS_ACCESS_TOKEN }}
          CW_SERVER: ${{ vars.CLOUDWAYS_SERVER_ID }}
          CW_APP:    ${{ vars.CLOUDWAYS_APP_ID }}
        run: |
          # Two ways in. CLOUDWAYS_ACCESS_TOKEN is used as a Bearer token directly;
          # it is the newer scheme and the one to use when the account has hit its
          # access-token limit and an existing token has to be reused. Otherwise the
          # legacy email + API key pair is exchanged for a short-lived token below.
          if [ -z "$CW_TOKEN" ] && { [ -z "$CW_EMAIL" ] || [ -z "$CW_KEY" ]; }; then
            echo "::notice::No Cloudways credentials set — skipping the pull."
            echo "Set CLOUDWAYS_ACCESS_TOKEN, or CLOUDWAYS_EMAIL + CLOUDWAYS_API_KEY."
            echo "The deploy branch is updated either way; without them the server"
            echo "picks it up only when you click Pull/Deploy in the Cloudways panel."
            exit 0
          fi
          # App 6748004 is "www.appliancecodex.com" on 2027 Server. The earlier default
          # pointed at 6730149, a different application on the same server, so a pull
          # would have deployed to the wrong place. Override with repository variables
          # if either ever changes.
          : "${CW_SERVER:=1680067}"
          : "${CW_APP:=6748004}"

          if [ -n "$CW_TOKEN" ]; then
            TOKEN="$CW_TOKEN"
            echo "Using CLOUDWAYS_ACCESS_TOKEN."
          else
            TOKEN=$(curl -sS --fail-with-body -X POST \
              https://api.cloudways.com/api/v1/oauth/access_token \
              -d "email=${CW_EMAIL}" -d "api_key=${CW_KEY}" \
              | python3 -c 'import sys,json; print(json.load(sys.stdin)["access_token"])')
            echo "Exchanged email + API key for a token."
          fi
          if [ -z "$TOKEN" ]; then
            echo "::error::Could not obtain a Cloudways token."; exit 1
          fi

          # deploy_path empty => public_html itself, matching the branch-root layout.
          RESP=$(curl -sS --fail-with-body -X POST \
            https://api.cloudways.com/api/v1/git/pull \
            -H "Authorization: Bearer ${TOKEN}" \
            -d "server_id=${CW_SERVER}" -d "app_id=${CW_APP}" \
            -d "branch_name=deploy" -d "deploy_path=")
          echo "Cloudways responded: ${RESP}"

      # The end-to-end check. Everything above can succeed while the public site stays
      # unchanged — that is exactly how five days went by unnoticed. This compares the
      # sitemap the live domain actually serves against the one just built, so the only
      # way the job goes green is if the pages are genuinely reachable by a visitor.
      # GitHub emails on a failed run, so a stalled release reports itself.
      - name: Verify the live site is serving this build
        if: steps.publish.outputs.published == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          SITE="$(python3 -c "import json;print(json.load(open('site/config.json'))['site_url'].rstrip('/'))")"
          echo "Checking ${SITE} ..."
          for attempt in 1 2 3 4 5 6; do
            sleep 20
            if curl -fsS --max-time 30 "${SITE}/sitemap.xml" -o live-sitemap.xml 2>/dev/null \
               && diff -q live-sitemap.xml dist/sitemap.xml >/dev/null; then
              echo "Live site matches the build (attempt ${attempt})."
              exit 0
            fi
            echo "attempt ${attempt}: not matching yet"
          done
          echo "::error::${SITE} is not serving the build that was just published."
          echo "::error::The deploy branch is correct, so this is the hosting side:"
          echo "::error::check the Cloudways pull above, DNS, and the SSL certificate."
          curl -sS -o /dev/null -w "::error::homepage returned %{http_code}\n" \
            --max-time 30 "${SITE}/" || true
          exit 1

      # Bing, Yandex, Seznam, Naver and Yep take submissions over IndexNow, so each
      # wave announces itself without anyone opening a dashboard. Google ignores
      # IndexNow and reads the sitemap instead; it also retired its sitemap ping
      # endpoint in 2023, so there is nothing to call for Google here.
      - name: Submit the new URLs to IndexNow
        if: steps.publish.outputs.published == 'true'
        continue-on-error: true      # never fail a good release over a notification
        run: |
          python3 - <<'PY' > indexnow.json
          import json, pathlib, re, subprocess
          cfg = json.loads(pathlib.Path("site/config.json").read_text())
          site = cfg["site_url"].rstrip("/")
          host = site.split("://", 1)[1]
          changed = subprocess.run(
              ["git", "-C", "deploy-wc", "diff", "--name-only", "HEAD~1", "HEAD"],
              capture_output=True, text=True).stdout.split()
          urls = sorted({
              site + "/" + re.sub(r"index\.html$", "", f)
              for f in changed if f.endswith("index.html")
          })
          if not urls:                      # first release, or a non-page change
              urls = re.findall(r"<loc>([^<]+)</loc>",
                                pathlib.Path("dist/sitemap.xml").read_text())
          print(json.dumps({
              "host": host,
              "key": cfg["indexnow_key"],
              "keyLocation": f"{site}/{cfg['indexnow_key']}.txt",
              "urlList": urls[:10000],
          }))
          PY
          echo "submitting $(python3 -c "import json;print(len(json.load(open('indexnow.json'))['urlList']))") urls"
          curl -sS --max-time 60 -X POST https://api.indexnow.org/indexnow \
            -H "Content-Type: application/json; charset=utf-8" \
            -d @indexnow.json -w "\nIndexNow HTTP %{http_code}\n"
