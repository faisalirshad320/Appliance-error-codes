name: Build and validate site

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate every content file against the page schema
        run: python3 tools/validate_content.py

      - name: Build the static site
        run: python3 site/build.py

      - name: Check internal links and structured data
        run: python3 tools/qa.py

      - name: Upload the built site
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist/
          retention-days: 14

  publish:
    # Pushes the built site to a deploy branch whose root IS the document root,
    # which is the shape Cloudways git deployment expects.
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 site/build.py
      - name: Push dist/ to the deploy branch
        run: |
          cd dist
          git init -q
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Build from ${GITHUB_SHA::8}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:deploy
