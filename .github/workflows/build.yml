name: Build and validate site

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Normalize spelling and presentational field lengths
        run: |
          python3 tools/fix_spelling.py
          python3 tools/normalize_content.py

      - name: Lint prose against the writer brief
        run: python3 tools/lint_prose.py

      - name: Validate every content file against the page schema
        run: python3 tools/validate_content.py

      - name: Build the static site
        # PUBLISH_ALL ignores the release schedule, so every page is built, linked and
        # checked here even when it is weeks away from going live. Releasing is a
        # separate workflow; this one is purely the quality gate.
        run: PUBLISH_ALL=1 python3 site/build.py

      - name: Check internal links and structured data
        run: python3 tools/qa.py

      - name: Check the release schedule covers every page exactly once
        run: python3 tools/check_schedule.py

      - name: Reconcile page map, batch assignments and content
        run: python3 tools/coverage.py

      - name: Check for near-duplicate prose between related pages
        run: python3 tools/dupe_check.py

      - name: Upload the built site
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist/
          retention-days: 14

